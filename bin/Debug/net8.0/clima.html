<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Clima MVC</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
    }
    body {
      margin: 0;
      padding: 40px 16px;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
    }
    .app-container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 20px 0;
      color: var(--text-main);
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    summary {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .result-card {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .temp-display {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0;
      letter-spacing: -0.04em;
    }
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .badge.alert { background: #fef2f2; color: #dc2626; }
    .badge.calm { background: #f0fdf4; color: #16a34a; }
    .meta-info {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>🌦️ Pronóstico Minimalista</h1>

    <!-- Selector de departamento o entrada manual -->
    <div class="form-group">
      <label for="ciudadInput">Departamento / Ciudad</label>
      <select id="ciudadSelect" onchange="actualizarClima()">
        <option value="Santa Cruz" selected>Santa Cruz</option>
        <option value="Cochabamba">Cochabamba</option>
        <option value="La Paz">La Paz</option>
        <option value="Tarija">Tarija</option>
        <option value="Potosí">Potosí</option>
        <option value="Chuquisaca">Chuquisaca</option>
        <option value="Oruro">Oruro</option>
        <option value="Beni">Beni</option>
        <option value="Pando">Pando</option>
      </select>
    </div>

    <!-- Acordeón para la conversión de unidad -->
    <details open>
      <summary>Unidad de temperatura</summary>
      <div class="radio-group">
        <label><input type="radio" name="tempUnit" value="C" checked onchange="actualizarClima()"> Celsius (°C)</label>
        <label><input type="radio" name="tempUnit" value="F" onchange="actualizarClima()"> Fahrenheit (°F)</label>
      </div>
    </details>

    <!-- Toggle Lluvia -->
    <div class="form-group">
      <label for="lluviaSelect">¿Incluir pronóstico de lluvia?</label>
      <select id="lluviaSelect" onchange="actualizarClima()">
        <option value="si" selected>Sí</option>
        <option value="no">No</option>
      </select>
    </div>

    <!-- Tarjeta de Resultado Dinámica -->
    <div class="result-card">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span id="cardCiudad" style="font-weight: 700; font-size: 1.15rem; color: var(--text-main);">Santa Cruz</span>
        <span id="cardBadge" class="badge alert">🌧️ Lluvia prevista</span>
      </div>
      <div id="cardTemp" class="temp-display">28.5°C</div>
      <div class="meta-info">💧 Humedad ambiental: <strong>65%</strong></div>
    </div>
  </div>

  <!-- JavaScript interactivo en el cliente -->
  <script>
    // Temperatura base almacenada en Celsius (como viene del Modelo)
    const tempBaseCelsius = 28,5;

    function actualizarClima() {
      // 1. Obtener la ciudad seleccionada
      const ciudad = document.getElementById('ciudadSelect').value;
      document.getElementById('cardCiudad').innerText = ciudad;

      // 2. Obtener la unidad seleccionada y convertir
      const esCelsius = document.querySelector('input[name="tempUnit"]:checked').value === 'C';
      if (esCelsius) {
        document.getElementById('cardTemp').innerText = tempBaseCelsius.toFixed(1) + '°C';
      } else {
        const tempFahrenheit = (tempBaseCelsius * 9 / 5) + 32;
        document.getElementById('cardTemp').innerText = tempFahrenheit.toFixed(1) + '°F';
      }

      // 3. Manejar estado de lluvia
      const incluirLluvia = document.getElementById('lluviaSelect').value === 'si';
      const badge = document.getElementById('cardBadge');
      
      if (incluirLluvia) {
        badge.className = 'badge alert';
        badge.innerText = '🌧️ Lluvia prevista';
        badge.style.display = 'inline-block';
      } else {
        badge.className = 'badge calm';
        badge.innerText = '☀️ Sin lluvia';
      }
    }

    // Ejecutar una vez al cargar
    actualizarClima();
  </script>
</body>
</html>
